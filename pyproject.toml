[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "buaa-learning-agent"
version = "0.2.0"
description = "A local-first course learning assistant for BUAA students"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.157,<0.158", "uvicorn>=0.54,<0.55", "httpx>=0.28,<0.29", "playwright==1.64.0", "Pillow>=12,<14", "reportlab>=4,<5", "python-dotenv>=1.1,<2", "tzdata>=2025.2,<2027"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[project.scripts]
buaa-agent = "buaa_agent.__main__:main"

[tool.setuptools.package-data]
buaa_agent = ["static/*", "static/icons/*", "static/fonts/*"]

[tool.setuptools.packages.find]
include = ["buaa_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.fastapi]
entrypoint = "buaa_agent.app:app"
